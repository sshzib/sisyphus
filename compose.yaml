services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sisyphus
      POSTGRES_PASSWORD: sisyphus
      POSTGRES_USER: sisyphus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisyphus"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - sisyphus-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/001-sisyphus-roles.sql:ro

volumes:
  sisyphus-postgres:
